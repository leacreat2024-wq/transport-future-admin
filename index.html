function go(i){current=i;tab='Все';search='';render();window.scrollTo({top:0,behavior:'smooth'})}function filterRows(){document.querySelectorAll('tbody tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(search.toLowerCase())?'':'none')}function render(){document.getElementById('nav').innerHTML=navGroups.map(g=>`<div class="caption">${g[0]}</div>`+screens.slice(g[1],g[2]+1).map((x,j)=>{let id=j+g[1];return `<button class="nav ${id===current?'active':''}" onclick="go(${id})"><span class="symbol">${x[1]}</span>${x[0]}<span class="num">${String(id+1).padStart(2,'0')}</span></button>`}).join('')).join('');document.getElementById('main').innerHTML=`<div class="breadcrumb">Рабочее пространство / ${screens[current][0]}</div><div class="hero"><div class="screen-label">ЭКРАН ${String(current+1).padStart(2,'0')} ИЗ 24</div><h1>${screens[current][0]}</h1><p>${screens[current][2]}</p></div>${view(current)}<p class="note">Дизайн-концепция на основании ТЗ конкурса «Транспорт будущего». Все имена, баллы, даты действий и числовые показатели в макетах демонстрационные и не отражают реальные данные конкурса.</p>`}function openModal(title,text){document.getElementById('modalTitle').textContent=title;document.getElementById('modalInfo').textContent=text;document.getElementById('modalInput').value='';document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}function confirmModal(){closeModal();alert('Демонстрационный прототип: действие показано без изменения данных.')}render();</script></body></html>
